name: Build

on:
  #push:
  #pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is an Intel runner, macos-14 is Apple silicon
        #os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-14]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0    # for setuptools_scm to work

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # see <https://cibuildwheel.pypa.io/en/stable/options/#build-skip>
          CIBW_BUILD: cp312-*
          CIBW_SKIP: cp*-musllinux_*
          # pin manylinux version
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # install dependencies (GMP, Z3) to /tmp/prefix
          CIBW_BEFORE_ALL: >
            source {package}/.github/workflows/install-deps.sh {project} ${{ matrix.os }} /tmp/prefix &&
            :
          # Set a Python-version-specific Boost cache dir so a cached 3.11
          # build does not collide with (and block) a fresh 3.12 build.
          # setup.py reads BOOST_CACHE_DIR and writes user-config.jam with the
          # correct Python headers from /opt/python/cp3XX-cp3XX/include/...
          CIBW_BEFORE_BUILD: >
            PYVER=$(python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')") &&
            echo "BOOST_CACHE_DIR=/tmp/boost_py${PYVER}" >> $CIBW_ENVIRONMENT_FILE
          # use installed dependencies in setup.py
          CIBW_ENVIRONMENT: >
            GMP_ROOT=/tmp/prefix
            Z3_PREFIX=/tmp/prefix
            LD_LIBRARY_PATH=/tmp/prefix/lib
        # with:
        #   package-dir: .
        #   output-dir: wheelhouse
        #   config-file: "{package}/pyproject.toml"

      - uses: actions/upload-artifact@v7
        with:
          #name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          archive: false
